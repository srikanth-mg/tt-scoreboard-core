project:
  title:        "Scoreboard Core"
  author:       "Srikanth M G"
  discord:      ""
  description:  "8-bit in-order issue, out-of-order write-back core with scoreboard and rename table"
  language:     "Verilog"
  clock_hz:     10000000

  tiles: "1x2"

  top_module:  "tt_um_srikanth_scoreboard"

  source_files:
    - "project.v"

pinout:
  # Inputs
  ui[0]: "instr rs2[0]"
  ui[1]: "instr rs2[1]"
  ui[2]: "instr rs1[0]"
  ui[3]: "instr rs1[1]"
  ui[4]: "instr rd[0]"
  ui[5]: "instr rd[1]"
  ui[6]: "instr op[0]"
  ui[7]: "instr op[1]"

  # Outputs
  uo[0]: "data[0]"
  uo[1]: "data[1]"
  uo[2]: "data[2]"
  uo[3]: "data[3]"
  uo[4]: "data[4]"
  uo[5]: "data[5]"
  uo[6]: "data[6]"
  uo[7]: "data[7]"

  # Bidirectional pins
  uio[0]: "instr_valid (in)"
  uio[1]: "mode (in)"
  uio[2]: "dbg_sel[0] (in)"
  uio[3]: "dbg_sel[1] (in)"
  uio[4]: "ready (out)"
  uio[5]: "commit_valid (out)"
  uio[6]: "commit_rd[0] (out)"
  uio[7]: "commit_rd[1] (out)"

  yaml_version: 6
